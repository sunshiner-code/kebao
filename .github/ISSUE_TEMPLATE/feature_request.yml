name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请说明使用场景与期望效果，帮助我们判断优先级。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下需要这个功能？解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它如何工作？有替代方案吗？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 后端 API
        - 智能体运行 / 流水线
        - 前端页面
        - 知识库 / 数据
        - 部署 / 配置
        - 文档
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 补充信息
      description: 相关 Issue、参考实现或设计草图。
    validations:
      required: false
