[project]
name = "techins"
version = "0.1.0"
description = "科技保险智能体业务平台：六个专业智能体覆盖科技保险产品设计、承保、在保监测与理赔全生命周期"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "kw_system contributors" }
]
keywords = ["insurance", "agent", "llm", "fastapi", "nextjs", "actuarial", "risk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Insurance",
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.4",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.6",
    "sse-starlette>=3.6.0",
    "statsmodels>=0.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
techins = "techins:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
